name: flutter_run_tracker_app
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
 
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^9.0.0 #ใช้ฟอนต์แปลกๆ จาก fonts.google.com
  font_awesome_flutter: ^11.0.0 #ใช้ไอคอน จาก fontawesome.com
  supabase_flutter: ^2.18.3 #ใช้สำหรับทำงานกับ Supabase
  image_picker: ^1.2.4 #ใช้สำหรับเลือกภาพจากแกลเลอรี่หรือภาพถ่ายจากกล้อง
 
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4 #ใช้สำหรับสร้างไอคอนให้กับแอพ
 
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
 
flutter:
  uses-material-design: true
  assets:
    - assets/images/